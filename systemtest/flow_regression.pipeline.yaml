# The flow regression's pipeline, kept here until it has a home: see README.md
# "Flow regression". It is NOT read by Ankra from this path. Ankra Pipelines reads
# .ankra/pipeline.yaml, and it does not go in ankra-cli's own: its protected sections
# would need approving before ankra-cli's own CI got its resources back.
#
# To run it: connect a bare repository holding this file as .ankra/pipeline.yaml, an
# administrator approves the definition, add the secrets, then add the schedule. Nothing
# runs from this file until a person does all of that.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "flow-regression"
on:
  schedule:
    - cron: "0 9 * * *"
      branch: "main"
      stages:
        - "checkout"
        - "regression"
  manual: {}
concurrency:
  group: "flow-regression"
  cancel_in_progress: false
workspace:
  size: "10Gi"
  access: "rwo"
defaults:
  timeout: "4h"
  network: "egress-https"
permissions:
  contents: "read"
secrets:
  - name: "ANKRA_API_TOKEN"
    from: "org_variable"
  - name: "GH_TOKEN"
    from: "org_variable"
  - name: "SLACK_BOT_TOKEN"
    from: "org_variable"
  - name: "FLOW_FAILURE_WEBHOOK_URL"
    from: "org_variable"
stages:
  - name: "checkout"
    kind: "checkout"
  - name: "regression"
    kind: "run"
    image: "golang:1.26.10@sha256:672c944cfd07599b5f1bb179869270cdc94c6254e41db4d431259693cb286b82"
    needs:
      - "checkout"
    secrets:
      - "ANKRA_API_TOKEN"
      - "GH_TOKEN"
      - "SLACK_BOT_TOKEN"
      - "FLOW_FAILURE_WEBHOOK_URL"
    resources:
      cpu: "2"
      memory: "4Gi"
    env:
      # The platform to test. Never production: the script refuses it.
      ANKRA_BASE_URL: "https://platform.ankra.dev"
      FLOW_REGRESSION_CONFIRM: "yes"
      # Set these to the regression organisation's own values.
      FLOW_ORGANISATION_ID: "REPLACE_ME"
      FLOW_CREDENTIAL_ID: "REPLACE_ME"
      FLOW_SSH_KEY_CREDENTIAL_ID: "REPLACE_ME"
      FLOW_ZONE: "REPLACE_ME"
      FLOW_PLAN: "REPLACE_ME"
      FLOW_FIXTURE_REPOSITORY: "REPLACE_ME-fixture"
      FLOW_ALERT_DESTINATION_ID: "REPLACE_ME"
      FLOW_SLACK_CHANNEL_ID: "REPLACE_ME"
    run: |
      set -eu
      # The image has git and curl. jq and gh are pinned here, on the workspace, because the root is read-only.
      mkdir -p /workspace/bin
      curl -fsSL -o /workspace/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
      chmod +x /workspace/bin/jq
      curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz |
        tar -xz -C /workspace/bin --strip-components=2 gh_2.62.0_linux_amd64/bin/gh
      git clone --depth 1 https://github.com/ankraio/ankra-cli.git /workspace/ankra-cli
      cd /workspace/ankra-cli
      go build -o /workspace/bin/ankra .
      export PATH="/workspace/bin:$PATH"
      ./systemtest/flow_regression.sh
