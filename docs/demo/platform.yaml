apiVersion: v1
kind: ImportCluster
metadata:
  name: staging-eu
spec:
  git_repository:
    provider: github
    credential_name: acme-platform
    repository: acme/platform-gitops
    branch: main
  stacks:
    - name: ingress
      deploy_wave: 1
      addons:
        - name: cert-manager
          chart_name: cert-manager
          chart_version: v1.19.1
          repository_url: https://charts.jetstack.io
          namespace: cert-manager
          parents: []
        - name: ingress-nginx
          chart_name: ingress-nginx
          chart_version: 4.13.3
          repository_url: https://kubernetes.github.io/ingress-nginx
          namespace: ingress
          parents:
            - addon: cert-manager
    - name: observability
      deploy_wave: 2
      addons:
        - name: loki
          chart_name: loki
          chart_version: 6.42.0
          repository_url: https://grafana.github.io/helm-charts
          namespace: observability
          parents: []
