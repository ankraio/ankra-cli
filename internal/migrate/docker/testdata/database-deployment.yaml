apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: notes
data:
  POSTGRES_USER: notes
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: notes
type: Opaque
stringData:
  POSTGRES_PASSWORD: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: notes
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  strategy:
    type: Recreate
  template:
    metadata:
      name: ""
      labels:
        app: db
    spec:
      enableServiceLinks: false
      containers:
        - name: db
          image: postgres:17.2
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secrets
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: notes
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
    - name: tcp-5432
      port: 5432
      targetPort: 5432
      protocol: TCP
