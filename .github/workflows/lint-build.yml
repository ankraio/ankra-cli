name: Lint, Test and Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

# Superseded runs used to keep their runner for the full race compile, so a
# branch pushed three times held three runners at once and later runs queued
# for hours (run 34059805725 waited 3h17m for a runner).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ${{ vars.CI_RUNNER_2 || 'ubuntu-latest' }}
    # A starved runner stops reporting rather than failing, so the job holds
    # its runner slot until someone notices: run 34042422066 sat on master for
    # ~6h before a human cancelled it. Fail fast and give the runner back.
    timeout-minutes: 45
    env:
      # ankra/cmd is one package, and the two heavy steps both compile its
      # test variant whole in a single `compile` process: golangci-lint (its
      # `go list -export` type-check) and the race+coverage test compile.
      # That compile, not any linter, is what kills this job (ankra-7ki7q3):
      # 233 test mocks embed baseMock, which implements all ~990 APIClient
      # methods, so the compiler builds a promoted-method wrapper per method
      # per mock: 538,496 functions for 211k source lines (a heap profile puts
      # the retained memory in noder.MakeWrappers and per-function SSA/DWARF
      # state). The non-test package alone compiles in 0.8GB. The wrapper
      # count is mocks x methods, so every new mock or client method adds to
      # it; ankra-fx8c23 removes the embedding.
      # Measured cold on ubuntu-latest (4 vCPU, 16GB) with GOMEMLIMIT=5GiB:
      # 15.7GB RSS plus ~8GB of swap, so with the stock 3GB swap the runner is
      # killed ("The runner has received a shutdown signal", runs 39756169469,
      # 39667479691; probe run 39759032594). staticcheck itself needs 0.9GB.
      # GOMEMLIMIT is a soft ceiling, inherited by every Go child process: it
      # costs nothing until the heap approaches it, then trades CPU for
      # footprint. Job-scoped so golangci-lint's compile gets it too.
      GOMEMLIMIT: 5GiB
      # -dwarf=false drops debug info from the compiled objects, which nothing
      # here reads: lint uses export data, and race reports and coverage use
      # the runtime's own line tables. It takes the cmd test compile from
      # 15.7GB + 8GB swap to a 12.8GB peak with no swap, and golangci-lint from
      # 11-12 minutes (or a dead runner) to about 5 (probe run 39764001667).
      # GOFLAGS reaches `go test`, `go build` and the `go list` that
      # golangci-lint and govulncheck run. A -gcflags given on a command line
      # replaces this one, so add -dwarf=false to any such flag.
      GOFLAGS: -gcflags=all=-dwarf=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The headroom left by -dwarf=false is ~1.5GB and the cmd test compile
      # keeps growing, so give it swap to fall back on: past RAM the compile
      # slows down instead of the runner being killed. /mnt is the hosted
      # runner's spare disk (~80GB free); the file is sized to what is free
      # there, keeping 4GB back, up to 16GB. Without passwordless sudo, or
      # with too little disk, the job runs on the runner's own swap and says so.
      - name: Add swap
        id: swap
        if: ${{ steps.setup_go.outcome == 'success' }}
        run: |
          swapfile=/mnt/ci.swap
          if ! sudo -n true 2>/dev/null; then
            echo "::warning::no passwordless sudo, so no extra swap: the cmd test compile has ~1.5GB of headroom"
          elif swapon --show=NAME --noheadings | grep -qx "$swapfile"; then
            echo "$swapfile is already active (a reused runner); keeping it"
          else
            avail_mb=$(df --output=avail -m /mnt | tail -1 | tr -d ' ')
            size_mb=$(( avail_mb - 4096 ))
            [ "$size_mb" -gt 16384 ] && size_mb=16384
            if [ "$size_mb" -lt 1024 ]; then
              echo "::warning::only ${avail_mb}MB free on /mnt, so no extra swap: the cmd test compile has ~1.5GB of headroom"
            elif sudo fallocate -l "${size_mb}M" "$swapfile" && sudo chmod 600 "$swapfile" \
              && sudo mkswap "$swapfile" >/dev/null && sudo swapon "$swapfile"; then
              echo "added ${size_mb}MB of swap at $swapfile"
              echo "created=true" >> "$GITHUB_OUTPUT"
            else
              sudo rm -f "$swapfile"
              echo "::warning::could not add swap at $swapfile: the cmd test compile has ~1.5GB of headroom"
            fi
          fi
          free -m
      - name: Verify embedded skills are in sync
        run: make verify-skills
      - name: Run golangci-lint
        # Lint findings and test failures are reported together: the steps
        # after this one run whether or not it (or the skills check) passed,
        # but not without a checkout and a Go toolchain.
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # routes.json is the cluster repo's route census (the walked chi router,
      # ankraio/cluster docs/route-census.md); every /api/v1 path the CLI builds
      # is checked against it. Fetched the way the portal fetches openapi.json.
      # CLUSTER_ROUTES_GITHUB_TOKEN is a fine-grained PAT with read-only
      # Contents access to ankraio/cluster.
      - name: Fetch cluster routes.json
        id: routes_fetch
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        env:
          CLUSTER_REPO: ankraio/cluster
          CLUSTER_ROUTES_REF: main
          CLUSTER_ROUTES_GITHUB_TOKEN: ${{ secrets.CLUSTER_ROUTES_GITHUB_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::pull request from a fork: repository secrets are unavailable, so the cluster route census was not fetched and TestClusterRoutesAreRegistered will skip, not pass"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLUSTER_ROUTES_GITHUB_TOKEN" ]; then
            echo "::error::CLUSTER_ROUTES_GITHUB_TOKEN is unset - add the repo secret (fine-grained PAT, contents:read on ankraio/cluster, the same PAT portal uses as CLUSTER_OPENAPI_GITHUB_TOKEN). Not route drift."
            exit 1
          fi
          http_status=$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLUSTER_ROUTES_GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github.raw+json" \
            --write-out "%{http_code}" \
            "https://api.github.com/repos/${CLUSTER_REPO}/contents/routes.json?ref=${CLUSTER_ROUTES_REF}" \
            -o "${{ github.workspace }}/routes.json")
          if [ "$http_status" != "200" ]; then
            echo "::error::Fetching cluster routes.json failed with HTTP $http_status (401/403: the PAT expired or lost contents:read; 404: the census moved from the cluster repo root)"
            exit 1
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      - name: Run tests
        id: tests
        if: ${{ !cancelled() && steps.routes_fetch.outcome == 'success' }}
        env:
          # Set only when the census was fetched; otherwise the route test skips
          # visibly instead of failing on a file that was never there.
          ANKRA_CLUSTER_ROUTES_JSON: ${{ steps.routes_fetch.outputs.fetched == 'true' && format('{0}/routes.json', github.workspace) || '' }}
        run: go test -race -count=1 -timeout=5m -coverprofile=coverage.out ./...
      - name: Check coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: go tool cover -func=coverage.out
      - name: Dry run build
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        run: go build -o /dev/null ./...
      - name: Run govulncheck
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        env:
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # A hosted runner is thrown away after the job; a reused one would keep
      # the swap file active and on disk. Only the job that created the file
      # removes it (one it found already active may belong to another job),
      # and a failed cleanup never decides the job's result.
      - name: Remove swap
        if: ${{ always() && steps.swap.outputs.created == 'true' && runner.environment != 'github-hosted' }}
        continue-on-error: true
        run: |
          sudo swapoff /mnt/ci.swap && sudo rm -f /mnt/ci.swap \
            || echo "::warning::could not remove /mnt/ci.swap; it stays on this runner"
