# Lifecycle system test: provisions REAL, billable clusters through the ankra
# CLI (systemtest/lifecycle_systemtest.sh) and tears them down again.
#
# Configuration is repository secrets/variables named SYSTEMTEST_*; none are
# defaulted. Without SYSTEMTEST_ANKRA_API_TOKEN the job skips with a notice.
#
#   Secrets (always):   SYSTEMTEST_ANKRA_API_TOKEN, SYSTEMTEST_SSH_KEY_CREDENTIAL_ID,
#                       SYSTEMTEST_HETZNER_CREDENTIAL_ID, SYSTEMTEST_OVH_CREDENTIAL_ID,
#                       SYSTEMTEST_UPCLOUD_CREDENTIAL_ID, SYSTEMTEST_DIGITALOCEAN_CREDENTIAL_ID,
#                       SYSTEMTEST_GKE_CREDENTIAL_ID, SYSTEMTEST_AKS_CREDENTIAL_ID,
#                       SYSTEMTEST_EKS_CREDENTIAL_ID
#   Variables (always): SYSTEMTEST_ANKRA_BASE_URL, SYSTEMTEST_ANKRA_ORG,
#                       SYSTEMTEST_GITOPS_CREDENTIAL_NAME, SYSTEMTEST_GITOPS_REPOSITORY
#
# The AWS lane (self-managed k3s on EC2 inside a VPC the account owns) is
# OPT-IN: it joins the scheduled matrix only when its secrets exist, and a
# manual dispatch has to name "aws" in `providers` explicitly. It preflights,
# creates a 1 control plane + 1 worker cluster, checks access-info and the
# node list, stops and starts it, deprovisions, then uses the AWS CLI to
# assert nothing tagged ankra.cloud/cluster-id remains and that the VPC's
# route tables, subnets and DHCP options are unchanged.
#
#   Secrets (aws):      SYSTEMTEST_AWS_CREDENTIAL_ID  - an Ankra aws credential id (role
#                                                      onboarded with scope self_managed, or keys)
#                       or SYSTEMTEST_AWS_ROLE_ARN + SYSTEMTEST_AWS_EXTERNAL_ID
#                                                    - registers a credential for the run and
#                                                      deletes it afterwards
#                       SYSTEMTEST_AWS_ACCESS_KEY_ID + SYSTEMTEST_AWS_SECRET_ACCESS_KEY
#                                                    - the account's own IAM keys for the AWS CLI
#                                                      leak check and VPC diff (read-only EC2 +
#                                                      IAM + tagging describe/get permissions);
#                                                      without them those two checks are SKIP
#   Variables (aws):    SYSTEMTEST_AWS_REGION, SYSTEMTEST_AWS_VPC_ID,
#                       SYSTEMTEST_AWS_NODE_SUBNET_IDS (comma-separated private subnets),
#                       SYSTEMTEST_AWS_BASTION_SUBNET_ID (a public subnet),
#                       SYSTEMTEST_AWS_BASTION_ALLOWED_IPS (comma-separated CIDRs; defaults to
#                                                          the runner's public IP /32)
#
name: Lifecycle system test

on:
  schedule:
    # 03:00 UTC every Monday, Wednesday and Friday (cron day-of-week: 1=Mon, 3=Wed, 5=Fri).
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Space-separated Ankra-managed providers to exercise (hetzner ovh upcloud digitalocean aws). Use "none" to skip the family. aws needs the SYSTEMTEST_AWS_* secrets and joins the scheduled default only when they exist.'
        required: false
        default: 'hetzner ovh upcloud digitalocean'
      managed_providers:
        description: 'Space-separated cloud-managed providers to exercise (doks uks gke ovh_mks aks eks). Use "none" to skip the family.'
        required: false
        default: 'doks uks gke ovh_mks aks eks'
      parallel:
        description: 'Run the selected targets concurrently (1) or one at a time (0).'
        required: false
        default: '1'

permissions:
  contents: read

# Each run provisions real, billable cloud infrastructure, so never let two runs
# overlap. A new run waits for the in-progress one to finish (and clean up).
concurrency:
  group: lifecycle-system-test
  cancel-in-progress: false

jobs:
  lifecycle-system-test:
    name: Cloud lifecycle system test
    runs-on: ${{ vars.CI_RUNNER_2 || 'ubuntu-latest' }}
    timeout-minutes: 240
    env:
      ANKRA_SYSTEMTEST_CONFIRM: 'yes'
      ANKRA_SYSTEMTEST_PROVIDERS: ${{ github.event.inputs.providers || 'hetzner ovh upcloud digitalocean' }}
      ANKRA_SYSTEMTEST_MANAGED_PROVIDERS: ${{ github.event.inputs.managed_providers || 'doks uks gke ovh_mks aks eks' }}
      ANKRA_SYSTEMTEST_PARALLEL: ${{ github.event.inputs.parallel || '1' }}
      ANKRA_API_TOKEN: ${{ secrets.SYSTEMTEST_ANKRA_API_TOKEN }}
      ANKRA_BASE_URL: ${{ vars.SYSTEMTEST_ANKRA_BASE_URL }}
      ANKRA_ORG: ${{ vars.SYSTEMTEST_ANKRA_ORG }}
      SSH_KEY_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_SSH_KEY_CREDENTIAL_ID }}
      HETZNER_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_HETZNER_CREDENTIAL_ID }}
      OVH_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_OVH_CREDENTIAL_ID }}
      UPCLOUD_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_UPCLOUD_CREDENTIAL_ID }}
      DIGITALOCEAN_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_DIGITALOCEAN_CREDENTIAL_ID }}
      GKE_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_GKE_CREDENTIAL_ID }}
      AKS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_AKS_CREDENTIAL_ID }}
      EKS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_EKS_CREDENTIAL_ID }}
      # AWS lane (opt-in; see the header comment).
      AWS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_AWS_CREDENTIAL_ID }}
      AWS_ROLE_ARN: ${{ secrets.SYSTEMTEST_AWS_ROLE_ARN }}
      AWS_EXTERNAL_ID: ${{ secrets.SYSTEMTEST_AWS_EXTERNAL_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SYSTEMTEST_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SYSTEMTEST_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.SYSTEMTEST_AWS_REGION || 'eu-west-1' }}
      AWS_VPC_ID: ${{ vars.SYSTEMTEST_AWS_VPC_ID }}
      AWS_NODE_SUBNET_IDS: ${{ vars.SYSTEMTEST_AWS_NODE_SUBNET_IDS }}
      AWS_BASTION_SUBNET_ID: ${{ vars.SYSTEMTEST_AWS_BASTION_SUBNET_ID }}
      AWS_BASTION_ALLOWED_IPS: ${{ vars.SYSTEMTEST_AWS_BASTION_ALLOWED_IPS }}
      GITOPS_CREDENTIAL_NAME: ${{ vars.SYSTEMTEST_GITOPS_CREDENTIAL_NAME }}
      GITOPS_REPOSITORY: ${{ vars.SYSTEMTEST_GITOPS_REPOSITORY }}
      TMPDIR: ${{ github.workspace }}/systemtest-artifacts
    steps:
      # Every SYSTEMTEST_* value above is a repository secret or variable, and a
      # repository without them cannot run this suite at all: the preflight in
      # lifecycle_systemtest.sh dies on the first empty credential seconds in.
      # On a schedule that reads as a broken build every Monday, Wednesday and
      # Friday, which is what the 30 consecutive red runs since 2026-06-22
      # actually were - nobody had created the secrets. Skip with a notice
      # instead, the way the cluster repo's nightly skips its live-model eval
      # tier when ANTHROPIC_API_KEY is absent.
      #
      # Only the API token is gated on. A repository that has the token but is
      # missing a provider credential IS misconfigured, and the preflight has
      # to keep failing loudly for it.
      - name: Check systemtest configuration
        id: configuration
        run: |
          if [ -n "$ANKRA_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SYSTEMTEST_ANKRA_API_TOKEN is not configured in this repository, so the cloud lifecycle system test is skipped. Each run provisions real billable cloud infrastructure, so these credentials are deliberately not defaulted."
          fi
          # The AWS lane is opt-in: it needs an Ankra aws credential (or a
          # role to register one from) plus the VPC to build in. With those
          # present it joins the scheduled/default matrix; a manual dispatch
          # that names providers explicitly has to name aws itself.
          if { [ -n "$AWS_CREDENTIAL_ID" ] || { [ -n "$AWS_ROLE_ARN" ] && [ -n "$AWS_EXTERNAL_ID" ]; }; } \
             && [ -n "$AWS_VPC_ID" ] && [ -n "$AWS_NODE_SUBNET_IDS" ] && [ -n "$AWS_BASTION_SUBNET_ID" ]; then
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The SYSTEMTEST_AWS_* secrets/variables are not (fully) configured, so the opt-in AWS lane is not added to this run."
          fi

      - name: Checkout code
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v6

      # TMPDIR (set job-wide above) lives inside the workspace so the test's
      # temp files survive for the log upload, but checkout starts from a
      # clean workspace. It must exist before anything invokes Go: setup-go
      # runs `go env`, and Go refuses to start with a missing TMPDIR.
      - name: Create TMPDIR
        if: steps.configuration.outputs.configured == 'true'
        run: mkdir -p "$TMPDIR"

      - name: Set up Go
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ankra binary
        if: steps.configuration.outputs.configured == 'true'
        run: go build -o bin/ankra .

      # The AWS lane's leak check and VPC diff need the AWS CLI and jq on the
      # runner (ubuntu-latest ships both; a self-hosted runner may not). Only
      # install what is missing, and only when the lane can actually run.
      - name: Ensure the AWS CLI and jq are available
        if: steps.configuration.outputs.configured == 'true' && steps.configuration.outputs.aws_configured == 'true'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
            sudo /tmp/awscliv2/aws/install
          fi
          aws --version

      - name: Run lifecycle system test
        if: steps.configuration.outputs.configured == 'true'
        run: |
          # "none" lets a dispatch skip a whole family (an empty input would
          # fall back to the default matrix instead).
          if [ "$ANKRA_SYSTEMTEST_PROVIDERS" = "none" ]; then export ANKRA_SYSTEMTEST_PROVIDERS=""; fi
          if [ "$ANKRA_SYSTEMTEST_MANAGED_PROVIDERS" = "none" ]; then export ANKRA_SYSTEMTEST_MANAGED_PROVIDERS=""; fi
          # Opt-in AWS lane: on the scheduled/default matrix (no explicit
          # providers input) add aws when its secrets exist. A dispatch that
          # names providers gets exactly what it named.
          if [ -z "${{ github.event.inputs.providers }}" ] && [ "${{ steps.configuration.outputs.aws_configured }}" = "true" ]; then
            export ANKRA_SYSTEMTEST_PROVIDERS="$ANKRA_SYSTEMTEST_PROVIDERS aws"
          fi
          ./systemtest/lifecycle_systemtest.sh

      # Debug aid only — an org storage-quota block on artifact uploads
      # must not redden a run whose cloud lifecycle actually passed.
      - name: Upload run logs
        if: always() && steps.configuration.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-system-test-logs
          path: systemtest-artifacts/**
          if-no-files-found: ignore
          retention-days: 14
