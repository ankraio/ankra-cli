# Lifecycle system test: provisions REAL, billable clusters through the ankra
# CLI (systemtest/lifecycle_systemtest.sh) and tears them down again.
#
# Configuration is repository secrets/variables named SYSTEMTEST_*; none are
# defaulted. Each selected provider is a LANE, and each lane is gated on its
# own settings: a lane whose settings are missing is skipped with a line
# naming them, the rest still run, and the job summary says
# "N of M provider lanes skipped: missing X". A scheduled run in which every
# lane is skipped FAILS - it tested nothing - while a manual dispatch that
# selected only unconfigured lanes passes with a warning.
#
#   Every lane:          secret SYSTEMTEST_ANKRA_API_TOKEN
#                        (variables SYSTEMTEST_ANKRA_BASE_URL + SYSTEMTEST_ANKRA_ORG pick
#                        the platform and org the credential ids below live in)
#   hetzner              secrets SYSTEMTEST_SSH_KEY_CREDENTIAL_ID + SYSTEMTEST_HETZNER_CREDENTIAL_ID
#   ovh                  secrets SYSTEMTEST_SSH_KEY_CREDENTIAL_ID + SYSTEMTEST_OVH_CREDENTIAL_ID
#   upcloud              secrets SYSTEMTEST_SSH_KEY_CREDENTIAL_ID + SYSTEMTEST_UPCLOUD_CREDENTIAL_ID
#   digitalocean         secrets SYSTEMTEST_SSH_KEY_CREDENTIAL_ID + SYSTEMTEST_DIGITALOCEAN_CREDENTIAL_ID
#   aws (opt-in)         see below
#   doks / uks / ovh_mks secret SYSTEMTEST_DIGITALOCEAN / _UPCLOUD / _OVH_CREDENTIAL_ID
#                        (the same credential as the Ankra-managed provider)
#   gke / aks / eks      secret SYSTEMTEST_GKE / _AKS / _EKS_CREDENTIAL_ID
#   Optional:            variables SYSTEMTEST_GITOPS_CREDENTIAL_NAME + SYSTEMTEST_GITOPS_REPOSITORY
#                        (without them the GitOps commit step is skipped)
#
# The credential ids are identifiers of credentials stored in that org
# (`ankra credentials list --org <org>`), not the cloud keys themselves.
#
# The AWS lane (self-managed k3s on EC2 in a network Ankra creates) is
# OPT-IN: it joins the scheduled matrix only when its secrets exist (so it is
# never counted as a skipped lane there), and a
# manual dispatch has to name "aws" in `providers` explicitly. It needs only
# credentials - no pre-made VPC: it preflights, creates a 1 control plane +
# 1 worker cluster in a VPC the platform builds (egress bastion_nat, the
# cheapest for CI; one zone), checks access-info and the node list, stops and
# starts it, deprovisions, then uses the AWS CLI to assert nothing tagged
# ankra.cloud/cluster-id remains - including the VPC, subnets, internet
# gateway, NAT gateways, route tables and EIPs of the created network.
#
#   Secrets (aws):      SYSTEMTEST_AWS_CREDENTIAL_ID  - an Ankra aws credential id (role
#                                                      onboarded with scope self_managed, or keys)
#                       or SYSTEMTEST_AWS_ROLE_ARN + SYSTEMTEST_AWS_EXTERNAL_ID
#                                                    - registers a credential for the run and
#                                                      deletes it afterwards
#                       SYSTEMTEST_AWS_ACCESS_KEY_ID + SYSTEMTEST_AWS_SECRET_ACCESS_KEY
#                                                    - the account's own IAM keys for the AWS CLI
#                                                      leak check (read-only EC2 + IAM + tagging
#                                                      describe/get permissions). REQUIRED: the
#                                                      leak check is the proof that the created
#                                                      network is gone, so the lane does not join
#                                                      the matrix without them
#   Variables (aws):    SYSTEMTEST_AWS_REGION (required),
#                       SYSTEMTEST_AWS_BASTION_ALLOWED_IPS (comma-separated CIDRs the bastion
#                                                          accepts SSH from; the script falls back
#                                                          to the runner's public IP /32 when unset)
#   Optional (aws):     SYSTEMTEST_AWS_EGRESS_MODE (nat_gateway to exercise NAT gateways instead
#                                                  of the bastion_nat default),
#                       SYSTEMTEST_AWS_AVAILABILITY_ZONES (comma-separated; three zones are built
#                                                         only when asked for here),
#                       SYSTEMTEST_AWS_NETWORK_IP_RANGE (server default 10.0.0.0/16),
#                       and, to switch the lane to ADOPTING a VPC you own instead:
#                       SYSTEMTEST_AWS_VPC_ID + SYSTEMTEST_AWS_NODE_SUBNET_IDS (comma-separated
#                       private subnets) + SYSTEMTEST_AWS_BASTION_SUBNET_ID (a public subnet) -
#                       then the VPC's route tables, subnets and DHCP options are also asserted
#                       unchanged after deprovision
#
# The node-group autoscaling step is OPT-IN too, and manual-dispatch only:
# `autoscaling: 1` runs it on every Ankra-managed lane (AWS included) just
# before the deprovision - enable min 1 / max 2 on the default group, wait
# for the Cluster Autoscaler, assert it registers every worker, force a
# scale-up with pods that need a second node, wait for the scale-down, then
# disable. It needs no extra secrets. Running it on the schedule is a
# separate decision (~25-50 min and one extra worker per lane, per run).
#
name: Lifecycle system test

on:
  schedule:
    # 03:00 UTC every Monday, Wednesday and Friday (cron day-of-week: 1=Mon, 3=Wed, 5=Fri).
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Space-separated Ankra-managed providers to exercise (hetzner ovh upcloud digitalocean aws). Use "none" to skip the family. aws needs the SYSTEMTEST_AWS_* secrets and joins the scheduled default only when they exist.'
        required: false
        default: 'hetzner ovh upcloud digitalocean'
      managed_providers:
        description: 'Space-separated cloud-managed providers to exercise (doks uks gke ovh_mks aks eks). Use "none" to skip the family.'
        required: false
        default: 'doks uks gke ovh_mks aks eks'
      parallel:
        description: 'Run the selected targets concurrently (1) or one at a time (0).'
        required: false
        default: '1'
      autoscaling:
        description: 'Also run the opt-in node-group autoscaling step (1) on every Ankra-managed lane: min 1 / max 2 on the default group, a forced scale-up and the scale-down after it. Adds ~25-50 min per lane (with parallel=0 that adds up: select fewer providers) and one extra worker for ~15-25 min. The schedule never runs it.'
        required: false
        default: '0'

permissions:
  contents: read

# Each run provisions real, billable cloud infrastructure, so never let two runs
# overlap. A new run waits for the in-progress one to finish (and clean up).
concurrency:
  group: lifecycle-system-test
  cancel-in-progress: false

jobs:
  lifecycle-system-test:
    name: Cloud lifecycle system test
    runs-on: ${{ vars.CI_RUNNER_2 || 'ubuntu-latest' }}
    timeout-minutes: 240
    env:
      ANKRA_SYSTEMTEST_CONFIRM: 'yes'
      ANKRA_SYSTEMTEST_PROVIDERS: ${{ github.event.inputs.providers || 'hetzner ovh upcloud digitalocean' }}
      ANKRA_SYSTEMTEST_MANAGED_PROVIDERS: ${{ github.event.inputs.managed_providers || 'doks uks gke ovh_mks aks eks' }}
      ANKRA_SYSTEMTEST_PARALLEL: ${{ github.event.inputs.parallel || '1' }}
      # Opt-in autoscaling step (see the header comment). Only a manual
      # dispatch can turn it on: the schedule has no inputs, so it always
      # reads '0' here. Deliberately not wired to a repository variable -
      # running it on the schedule changes the scheduled cost and runtime
      # and has to be an explicit change to this line.
      ANKRA_SYSTEMTEST_AUTOSCALING: ${{ github.event.inputs.autoscaling || '0' }}
      # Skip lines and the job summary name the repository secret/variable
      # (SYSTEMTEST_HETZNER_CREDENTIAL_ID), not the variable it is mapped to.
      ANKRA_SYSTEMTEST_CONFIG_PREFIX: SYSTEMTEST_
      # A schedule on which no lane can run has tested nothing: fail it. A
      # dispatch names its own lanes, and its summary says what was skipped.
      ANKRA_SYSTEMTEST_FAIL_IF_ALL_SKIPPED: ${{ github.event_name == 'schedule' && '1' || '0' }}
      ANKRA_API_TOKEN: ${{ secrets.SYSTEMTEST_ANKRA_API_TOKEN }}
      ANKRA_BASE_URL: ${{ vars.SYSTEMTEST_ANKRA_BASE_URL }}
      ANKRA_ORG: ${{ vars.SYSTEMTEST_ANKRA_ORG }}
      SSH_KEY_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_SSH_KEY_CREDENTIAL_ID }}
      HETZNER_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_HETZNER_CREDENTIAL_ID }}
      OVH_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_OVH_CREDENTIAL_ID }}
      UPCLOUD_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_UPCLOUD_CREDENTIAL_ID }}
      DIGITALOCEAN_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_DIGITALOCEAN_CREDENTIAL_ID }}
      GKE_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_GKE_CREDENTIAL_ID }}
      AKS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_AKS_CREDENTIAL_ID }}
      EKS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_EKS_CREDENTIAL_ID }}
      # AWS lane (opt-in; see the header comment).
      AWS_CREDENTIAL_ID: ${{ secrets.SYSTEMTEST_AWS_CREDENTIAL_ID }}
      AWS_ROLE_ARN: ${{ secrets.SYSTEMTEST_AWS_ROLE_ARN }}
      AWS_EXTERNAL_ID: ${{ secrets.SYSTEMTEST_AWS_EXTERNAL_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SYSTEMTEST_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SYSTEMTEST_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.SYSTEMTEST_AWS_REGION }}
      AWS_BASTION_ALLOWED_IPS: ${{ vars.SYSTEMTEST_AWS_BASTION_ALLOWED_IPS }}
      AWS_EGRESS_MODE: ${{ vars.SYSTEMTEST_AWS_EGRESS_MODE }}
      AWS_AVAILABILITY_ZONES: ${{ vars.SYSTEMTEST_AWS_AVAILABILITY_ZONES }}
      AWS_NETWORK_IP_RANGE: ${{ vars.SYSTEMTEST_AWS_NETWORK_IP_RANGE }}
      # Adopted-mode override: set all three to build inside a VPC you own
      # instead of one Ankra creates.
      AWS_VPC_ID: ${{ vars.SYSTEMTEST_AWS_VPC_ID }}
      AWS_NODE_SUBNET_IDS: ${{ vars.SYSTEMTEST_AWS_NODE_SUBNET_IDS }}
      AWS_BASTION_SUBNET_ID: ${{ vars.SYSTEMTEST_AWS_BASTION_SUBNET_ID }}
      GITOPS_CREDENTIAL_NAME: ${{ vars.SYSTEMTEST_GITOPS_CREDENTIAL_NAME }}
      GITOPS_REPOSITORY: ${{ vars.SYSTEMTEST_GITOPS_REPOSITORY }}
      TMPDIR: ${{ github.workspace }}/systemtest-artifacts
    steps:
      # Lane gating: every provider lane needs its own settings (header
      # comment). The guard used to test only SYSTEMTEST_ANKRA_API_TOKEN, so
      # a repository with the token but no provider credential ids started
      # the run and died in the script's preflight 35 s in ("FATAL:
      # HETZNER_CREDENTIAL_ID required for hetzner", every scheduled run from
      # 2026-09-14), and one without the token went green having tested
      # nothing (every "successful" run before that). Now the script plans
      # the lanes first, skips the unconfigured ones by name, and the plan -
      # not a single token check - decides whether anything runs.
      - name: Checkout code
        uses: actions/checkout@v6

      # TMPDIR (set job-wide above) lives inside the workspace so the test's
      # temp files survive for the log upload, but checkout starts from a
      # clean workspace. It must exist before anything invokes Go: setup-go
      # runs `go env`, and Go refuses to start with a missing TMPDIR.
      - name: Create TMPDIR
        run: mkdir -p "$TMPDIR"

      # Plan only: no binary, no cost gate, nothing provisioned. Writes the
      # lane table to the job summary and runnable_lanes to the step outputs;
      # exits non-zero on a schedule when no lane can run.
      - name: Plan provider lanes
        id: plan
        env:
          PROVIDERS_INPUT: ${{ github.event.inputs.providers }}
        run: |
          # The AWS lane is opt-in: it needs an Ankra aws credential (or a
          # role to register one from), the region, and the account's own
          # keys for the leak check that proves the created network is
          # gone. No VPC: Ankra creates the network. With those present it
          # joins the scheduled/default matrix; a manual dispatch that names
          # providers explicitly has to name aws itself.
          if { [ -n "$AWS_CREDENTIAL_ID" ] || { [ -n "$AWS_ROLE_ARN" ] && [ -n "$AWS_EXTERNAL_ID" ]; }; } \
             && [ -n "$AWS_REGION" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "aws_configured=true" >> "$GITHUB_OUTPUT"
            if [ -z "$PROVIDERS_INPUT" ]; then export ANKRA_SYSTEMTEST_PROVIDERS="$ANKRA_SYSTEMTEST_PROVIDERS aws"; fi
          else
            echo "aws_configured=false" >> "$GITHUB_OUTPUT"
          fi
          ANKRA_SYSTEMTEST_PLAN_ONLY=1 ./systemtest/lifecycle_systemtest.sh

      - name: Set up Go
        if: fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ankra binary
        if: fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0
        run: go build -o bin/ankra .

      # The AWS lane's leak check (and the VPC diff in adopted mode) needs the
      # AWS CLI and jq on the runner (ubuntu-latest ships both; a self-hosted
      # runner may not). Only install what is missing, and only when the lane
      # can actually run.
      - name: Ensure the AWS CLI and jq are available
        if: fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0 && steps.plan.outputs.aws_configured == 'true'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
            sudo /tmp/awscliv2/aws/install
          fi
          aws --version

      # The opt-in autoscaling step parses the CLI's -o json output with jq
      # (ubuntu-latest ships it; a self-hosted runner may not). Only a
      # Debian-family runner can install it here; anything else fails with
      # a clear message instead of a confusing apt-get error.
      - name: Ensure jq is available for the autoscaling step
        if: fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0 && env.ANKRA_SYSTEMTEST_AUTOSCALING == '1'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq jq
            else
              echo "::error::jq is required by the autoscaling step and this runner has neither jq nor apt-get; install jq in the runner image"
              exit 1
            fi
          fi
          jq --version

      - name: Run lifecycle system test
        if: fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0
        # The dispatch input reaches the script through the environment, never
        # through ${{ }} expansion inside `run`, so a crafted providers value
        # cannot become shell with the SYSTEMTEST_* secrets in scope.
        env:
          PROVIDERS_INPUT: ${{ github.event.inputs.providers }}
          AWS_CONFIGURED: ${{ steps.plan.outputs.aws_configured }}
        run: |
          # The same opt-in as the plan step, so both see the same lanes.
          if [ -z "$PROVIDERS_INPUT" ] && [ "$AWS_CONFIGURED" = "true" ]; then
            export ANKRA_SYSTEMTEST_PROVIDERS="$ANKRA_SYSTEMTEST_PROVIDERS aws"
          fi
          ./systemtest/lifecycle_systemtest.sh

      # Debug aid only — an org storage-quota block on artifact uploads
      # must not redden a run whose cloud lifecycle actually passed.
      - name: Upload run logs
        if: always() && fromJSON(steps.plan.outputs.runnable_lanes || '0') > 0
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-system-test-logs
          path: systemtest-artifacts/**
          if-no-files-found: ignore
          retention-days: 14
