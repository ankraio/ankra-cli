name: Sync CLI reference to ankra-docs

# Regenerates the CLI command reference from the released command tree and
# opens a PR against ankraio/ankra-docs so the public docs never drift from
# the shipped CLI. Requires the DOCS_REPO_TOKEN secret: a fine-grained PAT
# with contents:write + pull-requests:write on ankraio/ankra-docs.

on:
  push:
    tags:
      # Stable releases only (vMAJOR.MINOR.PATCH). Pre-release tags such as
      # v0.9.0-rc1 must not open docs PRs; the docs update ships with the
      # final release tag instead.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

# One sync at a time, so two releases tagged close together cannot race on
# closing each other's PRs below.
concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync-docs:
    name: Generate and PR CLI reference
    runs-on: ${{ vars.CI_RUNNER_2 || 'ubuntu-latest' }}
    steps:
      - name: Checkout ankra-cli
        uses: actions/checkout@v6
        with:
          # Full history so manual runs can name a version via git describe.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout ankra-docs
        uses: actions/checkout@v6
        with:
          repository: ankraio/ankra-docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: ankra-docs

      - name: Generate CLI reference
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          # On tag pushes ref_name is the release tag; manual runs name the
          # current commit instead so the docs banner is never stale.
          if [ "$EVENT" = "push" ]; then
            VERSION="$TAG"
          else
            VERSION="$(git describe --tags --always)"
          fi
          go run ./tools/gendocs --out ankra-docs/reference/cli --version "$VERSION"

      - name: Sync docs.json navigation
        working-directory: ankra-docs
        # A release that adds or drops a command family adds or removes a
        # page; without this, ankra-docs' check_nav fails the PR as an
        # orphaned or missing page and someone has to patch docs.json by hand.
        run: python3 scripts/sync_cli_nav.py

      - name: Open PR against ankra-docs
        working-directory: ankra-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Stage first: `git diff --quiet` alone is blind to untracked files,
          # which is exactly what a brand-new command family (or the first
          # sync into an empty reference/cli) produces.
          git add reference/cli docs.json
          if git diff --cached --quiet; then
            echo "CLI reference unchanged; nothing to sync."
            exit 0
          fi
          # ref_name is the branch (never empty) on workflow_dispatch, so
          # derive the label from the event instead of a ${TAG:-...} fallback.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            LABEL="manual-$RUN_ID"
          else
            LABEL="$TAG"
          fi
          BRANCH="cli-reference/$LABEL"
          git config user.name "ankra-cli-docs-bot"
          git config user.email "engineering@ankra.io"
          git checkout -b "$BRANCH"
          git commit -m "docs: regenerate CLI reference for ankra-cli $LABEL"
          # Force so a re-run of the same tag refreshes its own bot branch
          # instead of failing non-fast-forward.
          git push -u origin "$BRANCH" --force
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "Regenerate CLI reference ($LABEL)" \
              --body "Automated update generated by \`tools/gendocs\` in ankra-cli, with the CLI group in docs.json resynced by \`scripts/sync_cli_nav.py\`. Review the diff and merge to publish." \
              --base master
          fi
          # Every regen rewrites the whole reference, so an open regen PR
          # for an older release (or an earlier manual run) is superseded by
          # this one: merging it would roll the docs back, and left open it
          # only rots into a conflict. Close those, never a newer release's
          # PR in case tags finish out of order. Manual runs close nothing.
          if [ "$EVENT" = "push" ]; then
            gh pr list --state open --limit 200 --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("cli-reference/")) | "\(.number) \(.headRefName)"' |
            while read -r NUM HEAD; do
              [ "$HEAD" = "$BRANCH" ] && continue
              OTHER="${HEAD#cli-reference/}"
              case "$OTHER" in
                manual-*) ;;
                v*)
                  OLDEST="$(printf '%s\n%s\n' "$OTHER" "$LABEL" | sort -V | head -n1)"
                  [ "$OLDEST" = "$OTHER" ] || continue
                  ;;
                *) continue ;;
              esac
              gh pr close "$NUM" --delete-branch \
                --comment "Superseded by the CLI reference regen for $LABEL (branch $BRANCH), which regenerates every page." \
                </dev/null || echo "::warning::could not close superseded docs PR #$NUM"
            done
          fi
